<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}">
    <title>Adjust Stock - Retail Management System</title>
</head>
<body>
    <div th:replace="~{layout/header :: navbar}"></div>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>
                        <i class="fas fa-edit me-2"></i>Adjust Stock
                    </h2>
                    <a href="/inventory" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Back to Inventory
                    </a>
                </div>
            </div>
        </div>

        <!-- Alert Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Stock Adjustment Form -->
        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-box me-2"></i>Product Information
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <tr>
                                <th>Product Code:</th>
                                <td th:text="${product.productCode}">PRD-001</td>
                            </tr>
                            <tr>
                                <th>Product Name:</th>
                                <td th:text="${product.name}">Product Name</td>
                            </tr>
                            <tr>
                                <th>Current Stock:</th>
                                <td class="text-primary" th:text="${product.stockQuantity} + ' ' + ${product.unit}">10 pcs</td>
                            </tr>
                            <tr>
                                <th>Minimum Stock:</th>
                                <td th:text="${product.minimumStock} + ' ' + ${product.unit}">10 pcs</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-sliders-h me-2"></i>Adjust Stock
                    </div>
                    <div class="card-body">
                        <form th:action="@{/inventory/adjust}" method="post">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            
                            <div class="mb-3">
                                <label for="newQuantity" class="form-label">New Stock Quantity *</label>
                                <input type="number" class="form-control" id="newQuantity" name="newQuantity" 
                                       th:value="${product.stockQuantity}" min="0" required>
                            </div>

                            <div class="mb-3">
                                <label for="notes" class="form-label">Notes</label>
                                <textarea class="form-control" id="notes" name="notes" rows="3" 
                                          placeholder="Reason for adjustment..."></textarea>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a href="/inventory" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>Update Stock
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/header :: scripts}"></div>
</body>
</html>
