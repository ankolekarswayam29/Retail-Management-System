<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetailPro | System Bootstrap Initialization</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #080c14;
            --surface-card: rgba(15, 23, 42, 0.85);
            --border-card: rgba(255, 255, 255, 0.08);
            --emerald-accent: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.25);
            --purple-accent: #8b5cf6;
            --purple-glow: rgba(139, 92, 246, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            color: var(--text-main);
        }

        .setup-wrapper {
            width: 100%;
            max-width: 580px;
            background: var(--surface-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .setup-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--emerald-accent), var(--purple-accent));
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(139, 92, 246, 0.15));
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: var(--emerald-accent);
            box-shadow: 0 0 25px var(--emerald-glow);
        }

        .brand-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .brand-title span {
            color: var(--emerald-accent);
        }

        .brand-subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin-bottom: 0;
        }

        .badge-secure {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #c4b5fd;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .form-label {
            font-size: 12.5px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group-custom i.field-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 14px;
            z-index: 5;
            transition: color 0.2s ease;
        }

        .input-group-custom input {
            width: 100%;
            height: 46px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 0 16px 0 42px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .input-group-custom input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--emerald-accent);
            box-shadow: 0 0 0 3px var(--emerald-glow);
        }

        .input-group-custom input:focus + i.field-icon {
            color: var(--emerald-accent);
        }

        .btn-setup {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, var(--emerald-accent), #059669);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.35);
            transition: all 0.2s ease;
            margin-top: 24px;
        }

        .btn-setup:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(16, 185, 129, 0.45);
        }

        .alert-custom {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .security-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="setup-wrapper">
    <div class="brand-header">
        <div class="brand-icon">
            <i class="fas fa-shield-halved"></i>
        </div>
        <h1 class="brand-title">Retail<span>Pro</span> Enterprise</h1>
        <p class="brand-subtitle">One-Time Administrator Provisioning & System Bootstrap</p>
        <span class="badge-secure"><i class="fas fa-lock"></i> ZERO-TRUST INITIALIZATION</span>
    </div>

    <!-- Error Alert -->
    <div th:if="${error}" class="alert-custom alert-error">
        <i class="fas fa-circle-exclamation text-danger"></i>
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/setup}" method="post" id="setupForm">
        <!-- CSRF Token -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="mb-3">
            <label class="form-label" for="secretKey">Administrator Activation Key (Secret)</label>
            <div class="input-group-custom">
                <input type="password" id="secretKey" name="secretKey" required 
                       placeholder="Enter RETAILPRO_ADMIN_SECRET key" autocomplete="off">
                <i class="fas fa-key field-icon"></i>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="username">Admin Username</label>
                <div class="input-group-custom">
                    <input type="text" id="username" name="username" th:value="${username}" required 
                           placeholder="e.g. sysadmin" autocomplete="username">
                    <i class="fas fa-user-shield field-icon"></i>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="fullName">Full Name</label>
                <div class="input-group-custom">
                    <input type="text" id="fullName" name="fullName" th:value="${fullName}" required 
                           placeholder="e.g. John Doe" autocomplete="name">
                    <i class="fas fa-id-badge field-icon"></i>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="email">Administrator Email</label>
            <div class="input-group-custom">
                <input type="email" id="email" name="email" th:value="${email}" required 
                       placeholder="admin@retailpro.com" autocomplete="email">
                <i class="fas fa-envelope field-icon"></i>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="password">Password (Min 8 chars)</label>
                <div class="input-group-custom">
                    <input type="password" id="password" name="password" minlength="8" required 
                           placeholder="Strong master password" autocomplete="new-password">
                    <i class="fas fa-lock field-icon"></i>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <div class="input-group-custom">
                    <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required 
                           placeholder="Re-enter password" autocomplete="new-password">
                    <i class="fas fa-check-double field-icon"></i>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-setup" id="submitBtn">
            <i class="fas fa-check-circle"></i> Complete Initialization & Lock Bootstrap
        </button>
    </form>

    <div class="security-footer">
        <i class="fas fa-shield-alt me-1"></i> Once an administrator is provisioned, this initialization gateway is permanently disabled.
    </div>
</div>

<script>
    document.getElementById('setupForm').addEventListener('submit', function() {
        const btn = document.getElementById('submitBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Initializing System...';
        btn.disabled = true;
    });
</script>

</body>
</html>
