<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetailPro | Set Account Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #080c14;
            --surface-card: rgba(15, 23, 42, 0.88);
            --border-card: rgba(255, 255, 255, 0.08);
            --emerald-accent: #10b981;
            --emerald-glow: rgba(16, 185, 129, 0.25);
            --purple-accent: #8b5cf6;
            --purple-glow: rgba(139, 92, 246, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            color: var(--text-main);
        }

        .auth-wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--surface-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 38px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .auth-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--emerald-accent), var(--purple-accent));
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(139, 92, 246, 0.15));
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--emerald-accent);
            box-shadow: 0 0 25px var(--emerald-glow);
        }

        .brand-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .brand-title span {
            color: var(--emerald-accent);
        }

        .brand-subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            margin: 0;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fbbf24;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 600;
            margin-top: 10px;
        }

        .form-label {
            font-size: 12.5px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group-custom i.field-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 14px;
            z-index: 5;
            transition: color 0.2s ease;
        }

        .input-group-custom input {
            width: 100%;
            height: 46px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 0 42px 0 42px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .input-group-custom input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--emerald-accent);
            box-shadow: 0 0 0 3px var(--emerald-glow);
        }

        .input-group-custom input:focus + i.field-icon {
            color: var(--emerald-accent);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 0;
            font-size: 14px;
            z-index: 5;
        }

        .toggle-password:hover {
            color: var(--emerald-accent);
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, var(--emerald-accent), #059669);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 14.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.35);
            transition: all 0.2s ease;
            margin-top: 20px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(16, 185, 129, 0.45);
        }

        .alert-custom {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .password-rules {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 18px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .password-rules ul {
            margin: 4px 0 0;
            padding-left: 18px;
        }

        .logout-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .logout-link:hover {
            color: #f87171;
        }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="brand-header">
        <div class="brand-icon">
            <i class="fas fa-key"></i>
        </div>
        <h1 class="brand-title">Retail<span>Pro</span> Security</h1>
        <p class="brand-subtitle" th:if="${mustChange}">First Login Password Setup Required</p>
        <p class="brand-subtitle" th:unless="${mustChange}">Update Account Password</p>

        <div th:if="${mustChange}" class="security-badge">
            <i class="fas fa-shield-alt"></i> Temporary Password Must Be Replaced
        </div>
    </div>

    <!-- Error Alert -->
    <div th:if="${error}" class="alert-custom alert-error">
        <i class="fas fa-circle-exclamation text-danger"></i>
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/change-password}" method="post" id="changePasswordForm">
        <!-- CSRF Token -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="mb-3">
            <label class="form-label" for="currentPassword">Current / Temporary Password</label>
            <div class="input-group-custom">
                <input type="password" id="currentPassword" name="currentPassword" required 
                       placeholder="Enter current password" autocomplete="current-password">
                <i class="fas fa-lock-open field-icon"></i>
                <button type="button" class="toggle-password" onclick="toggleField('currentPassword', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="newPassword">New Password</label>
            <div class="input-group-custom">
                <input type="password" id="newPassword" name="newPassword" minlength="8" required 
                       placeholder="Enter new strong password" autocomplete="new-password">
                <i class="fas fa-lock field-icon"></i>
                <button type="button" class="toggle-password" onclick="toggleField('newPassword', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="confirmPassword">Confirm New Password</label>
            <div class="input-group-custom">
                <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required 
                       placeholder="Confirm new password" autocomplete="new-password">
                <i class="fas fa-check-double field-icon"></i>
                <button type="button" class="toggle-password" onclick="toggleField('confirmPassword', this)">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <div class="password-rules">
            <i class="fas fa-info-circle me-1 accent-emerald"></i> <strong>Password Security Policy:</strong>
            <ul>
                <li>Minimum 8 characters length</li>
                <li>Must differ from your temporary password</li>
            </ul>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
            <i class="fas fa-shield-check"></i> Save New Password & Proceed
        </button>
    </form>

    <a th:href="@{/logout}" class="logout-link">
        <i class="fas fa-sign-out-alt me-1"></i> Sign out to login later
    </a>
</div>

<script>
    function toggleField(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    document.getElementById('changePasswordForm').addEventListener('submit', function() {
        const btn = document.getElementById('submitBtn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Securing Account...';
        btn.disabled = true;
    });
</script>

</body>
</html>
