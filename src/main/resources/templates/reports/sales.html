<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}">
    <title>Sales Reports - Retail Management System</title>
</head>
<body>
    <div th:replace="~{layout/header :: navbar}"></div>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>
                        <i class="fas fa-chart-bar me-2"></i>Sales Reports
                    </h2>
                    <a href="/dashboard" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                    </a>
                </div>
            </div>
        </div>

        <!-- Month Selection -->
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/reports/sales}" method="get" class="row g-3">
                    <div class="col-md-3">
                        <label for="year" class="form-label">Year</label>
                        <select class="form-select" id="year" name="year">
                            <option value="2024" th:selected="${reportData.year == 2024}">2024</option>
                            <option value="2023" th:selected="${reportData.year == 2023}">2023</option>
                            <option value="2022" th:selected="${reportData.year == 2022}">2022</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="month" class="form-label">Month</label>
                        <select class="form-select" id="month" name="month">
                            <option value="1" th:selected="${reportData.month == 1}">January</option>
                            <option value="2" th:selected="${reportData.month == 2}">February</option>
                            <option value="3" th:selected="${reportData.month == 3}">March</option>
                            <option value="4" th:selected="${reportData.month == 4}">April</option>
                            <option value="5" th:selected="${reportData.month == 5}">May</option>
                            <option value="6" th:selected="${reportData.month == 6}">June</option>
                            <option value="7" th:selected="${reportData.month == 7}">July</option>
                            <option value="8" th:selected="${reportData.month == 8}">August</option>
                            <option value="9" th:selected="${reportData.month == 9}">September</option>
                            <option value="10" th:selected="${reportData.month == 10}">October</option>
                            <option value="11" th:selected="${reportData.month == 11}">November</option>
                            <option value="12" th:selected="${reportData.month == 12}">December</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-filter me-2"></i>Filter
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card stat-card primary">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="card-title">Monthly Revenue</h5>
                                <h2 class="text-white" th:text="'$' + ${reportData.monthlyRevenue}">$0.00</h2>
                                <p th:text="'For ' + ${reportData.month} + '/' + ${reportData.year}">Month/Year</p>
                            </div>
                            <div class="stat-icon">
                                <i class="fas fa-dollar-sign"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Monthly Sales Chart -->
        <div class="card mb-4">
            <div class="card-header">
                <i class="fas fa-chart-line me-2"></i>Monthly Sales Chart (Current Year)
            </div>
            <div class="card-body">
                <div class="chart-container">
                    <canvas id="monthlySalesChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/header :: scripts}"></div>
    <script th:inline="javascript">
        const ctx = document.getElementById('monthlySalesChart').getContext('2d');
        const monthlySales = /*[[${chartData.monthlySales}]]*/ {};
        
        const labels = Object.keys(monthlySales).map(month => {
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return monthNames[parseInt(month) - 1];
        });
        const data = Object.values(monthlySales);
        
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Monthly Revenue',
                    data: data,
                    backgroundColor: 'rgba(102, 126, 234, 0.8)',
                    borderColor: '#667eea',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
