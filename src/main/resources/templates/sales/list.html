<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}">
    <title th:text="${title != null ? title : 'Sales'} + ' - Retail Management System'">Sales</title>
</head>
<body>
    <div th:replace="~{layout/header :: navbar}"></div>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>
                        <i class="fas fa-shopping-cart me-2"></i>
                        <span th:text="${title != null ? title : 'All Sales'}">All Sales</span>
                    </h2>
                    <div>
                        <a href="/sales/today" class="btn btn-info me-2">
                            <i class="fas fa-calendar-day me-2"></i>Today's Sales
                        </a>
                        <a href="/billing" class="btn btn-primary">
                            <i class="fas fa-plus me-2"></i>New Sale
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sales Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Invoice #</th>
                                <th>Date</th>
                                <th>Customer</th>
                                <th>Total</th>
                                <th>Payment</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="sale : ${sales}">
                                <td th:text="${sale.invoiceNumber}">INV-001</td>
                                <td th:text="${#temporals.format(sale.saleDate, 'MMM dd, yyyy HH:mm')}">Jan 01, 2024 10:00</td>
                                <td th:text="${sale.customer != null ? sale.customer.name : 'Walk-in'}">Customer</td>
                                <td class="text-success" th:text="'$' + ${sale.totalAmount}">$0.00</td>
                                <td th:text="${sale.paymentMethod}">CASH</td>
                                <td>
                                    <span th:if="${sale.paymentStatus == 'PAID'}" class="badge badge-success">PAID</span>
                                    <span th:if="${sale.paymentStatus == 'PENDING'}" class="badge badge-warning">PENDING</span>
                                    <span th:if="${sale.paymentStatus == 'REFUNDED'}" class="badge badge-danger">REFUNDED</span>
                                </td>
                                <td>
                                    <a th:href="@{/billing/invoice/{id}(id=${sale.id})}" class="btn btn-sm btn-primary" target="_blank">
                                        <i class="fas fa-file-invoice"></i> Invoice
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${sales == null || sales.empty}" class="text-center text-muted py-4">
                    <i class="fas fa-shopping-cart fa-3x mb-3"></i>
                    <p>No sales found</p>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/header :: scripts}"></div>
</body>
</html>
