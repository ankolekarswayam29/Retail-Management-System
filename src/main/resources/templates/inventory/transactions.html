<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: head}">
    <title>Stock Transactions - Retail Management System</title>
</head>
<body>
    <div th:replace="~{layout/header :: navbar}"></div>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>
                        <i class="fas fa-history me-2"></i>Stock Transactions
                    </h2>
                    <a href="/inventory" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Back to Inventory
                    </a>
                </div>
            </div>
        </div>

        <!-- Transactions Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Product</th>
                                <th>Type</th>
                                <th>Quantity</th>
                                <th>Previous</th>
                                <th>New</th>
                                <th>Notes</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="transaction : ${transactions}">
                                <td th:text="${#temporals.format(transaction.createdAt, 'MMM dd, yyyy HH:mm')}">Jan 01, 2024 10:00</td>
                                <td th:text="${transaction.product.name}">Product Name</td>
                                <td>
                                    <span th:if="${transaction.transactionType == 'PURCHASE'}" class="badge badge-success">PURCHASE</span>
                                    <span th:if="${transaction.transactionType == 'SALE'}" class="badge badge-danger">SALE</span>
                                    <span th:if="${transaction.transactionType == 'ADJUSTMENT'}" class="badge badge-warning">ADJUSTMENT</span>
                                    <span th:if="${transaction.transactionType == 'RETURN'}" class="badge badge-info">RETURN</span>
                                    <span th:if="${transaction.transactionType == 'DAMAGE'}" class="badge badge-danger">DAMAGE</span>
                                </td>
                                <td th:text="${transaction.quantity}">10</td>
                                <td th:text="${transaction.previousQuantity}">10</td>
                                <td th:text="${transaction.newQuantity}">10</td>
                                <td th:text="${transaction.notes != null ? transaction.notes : 'N/A'}">Notes</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${transactions == null || transactions.empty}" class="text-center text-muted py-4">
                    <i class="fas fa-history fa-3x mb-3"></i>
                    <p>No stock transactions found</p>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/header :: scripts}"></div>
</body>
</html>
