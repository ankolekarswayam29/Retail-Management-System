# =====================================
# APPLICATION CONFIGURATION
# =====================================
spring.application.name=Retail Management System
server.port=8080

# =====================================
# MYSQL DATABASE CONFIGURATION
# =====================================
spring.datasource.url=jdbc:mysql://localhost:3306/retail_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================
# JPA CONFIGURATION
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# =====================================
# THYMELEAF CONFIGURATION
# =====================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# =====================================
# FILE UPLOAD CONFIGURATION
# =====================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================================
# LOGGING CONFIGURATION
# =====================================
logging.level.com.retailpro=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework.security=DEBUG

# =====================================
# DATE FORMAT
# =====================================
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss

# =====================================
# SECURITY & BOOTSTRAP CONFIGURATION
# =====================================
retailpro.security.bootstrap.secret-key=${RETAILPRO_ADMIN_SECRET:}
retailpro.security.bootstrap.initial-username=${RETAILPRO_ADMIN_USERNAME:}
retailpro.security.bootstrap.initial-password=${RETAILPRO_ADMIN_PASSWORD:}
retailpro.security.bootstrap.initial-email=${RETAILPRO_ADMIN_EMAIL:admin@retailpro.com}
retailpro.security.bootstrap.initial-fullname=${RETAILPRO_ADMIN_NAME:System Administrator}
